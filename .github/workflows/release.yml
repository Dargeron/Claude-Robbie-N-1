name: Release

# Publishes a test build for Albert on the Releases page. The build is made and signed in a Claude session
# (tools/release.sh), which pushes it to the throwaway branch `release-drop` as one commit on top of the source:
# release/RobbieN1-<version>.apk and release/RobbieN1-<version>-windows.zip, with RELEASE.md as the notes.
# This job attaches the files to a release tagged v<version> on the source commit, then deletes the branch, so the
# binaries never stay in the project's history and nobody downloads them with the code.

on:
  push:
    branches: [release-drop]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: What is being released
        id: v
        run: |
          v=$(grep -m1 -oE '^# [0-9][^ ]*' RELEASE.md | cut -c3-)
          [[ -n "$v" ]] || { echo "::error::RELEASE.md must start with '# <version> ...'"; exit 1; }
          for f in "release/RobbieN1-$v.apk" "release/RobbieN1-$v-windows.zip"; do
            [[ -s "$f" ]] || { echo "::error::missing $f"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          echo "Releasing $v from $(git rev-parse --short HEAD^)"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Robbie N+1 ${{ steps.v.outputs.version }}
          body_path: RELEASE.md
          target_commitish: ${{ steps.v.outputs.source }}
          prerelease: true
          files: |
            release/RobbieN1-${{ steps.v.outputs.version }}.apk
            release/RobbieN1-${{ steps.v.outputs.version }}-windows.zip

      - name: Delete the drop branch
        if: always()
        run: git push origin --delete release-drop
